<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="cp-die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a5f"/>
      <stop offset="1" stop-color="#0e2240"/>
    </linearGradient>
    <linearGradient id="cp-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="cp-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#cp-bg)"/>
  <g stroke="#2c4a74" stroke-width="1" opacity="0.5">
    <path d="M0 150 H1600"/><path d="M0 300 H1600"/><path d="M0 450 H1600"/><path d="M0 600 H1600"/><path d="M0 750 H1600"/>
    <path d="M200 0 V900"/><path d="M400 0 V900"/><path d="M600 0 V900"/><path d="M800 0 V900"/><path d="M1000 0 V900"/><path d="M1200 0 V900"/><path d="M1400 0 V900"/>
  </g>
  <!-- chip package -->
  <g transform="translate(800 450)">
    <rect x="-330" y="-330" width="660" height="660" rx="48" fill="#0b1c33" stroke="#2c4a74" stroke-width="6"/>
    <rect x="-250" y="-250" width="500" height="500" rx="30" fill="url(#cp-die)" stroke="#60a5fa" stroke-width="4"/>
    <g fill="#0e2240" stroke="#60a5fa" stroke-width="3">
      <rect x="-196" y="-196" width="168" height="168" rx="14"/>
      <rect x="28" y="-196" width="168" height="168" rx="14"/>
      <rect x="-196" y="28" width="168" height="168" rx="14"/>
      <rect x="28" y="28" width="168" height="168" rx="14"/>
    </g>
    <g fill="#34d399" opacity="0.85">
      <circle cx="-112" cy="-112" r="16"/><circle cx="112" cy="-112" r="16"/>
      <circle cx="-112" cy="112" r="16"/><circle cx="112" cy="112" r="16"/>
    </g>
  </g>
  <!-- pins -->
  <g fill="url(#cp-trace)">
    <rect x="770" y="60" width="18" height="80" rx="6"/><rect x="850" y="60" width="18" height="80" rx="6"/>
    <rect x="690" y="60" width="18" height="80" rx="6"/><rect x="930" y="60" width="18" height="80" rx="6"/>
    <rect x="770" y="760" width="18" height="80" rx="6"/><rect x="850" y="760" width="18" height="80" rx="6"/>
    <rect x="690" y="760" width="18" height="80" rx="6"/><rect x="930" y="760" width="18" height="80" rx="6"/>
    <rect x="60" y="380" width="80" height="18" rx="6"/><rect x="60" y="470" width="80" height="18" rx="6"/>
    <rect x="60" y="290" width="80" height="18" rx="6"/><rect x="60" y="560" width="80" height="18" rx="6"/>
    <rect x="1460" y="380" width="80" height="18" rx="6"/><rect x="1460" y="470" width="80" height="18" rx="6"/>
    <rect x="1460" y="290" width="80" height="18" rx="6"/><rect x="1460" y="560" width="80" height="18" rx="6"/>
  </g>
  <!-- traces -->
  <g fill="none" stroke="url(#cp-trace)" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M140 300 H300 L400 200 H520"/>
    <path d="M140 560 H320 L420 660 H520"/>
    <path d="M1460 290 H1300 L1200 190 H1080"/>
    <path d="M1460 560 H1280 L1180 660 H1080"/>
  </g>
  <g fill="#60a5fa" filter="url(#cp-glow)" opacity="0.7">
    <circle cx="400" cy="200" r="10"/><circle cx="420" cy="660" r="10"/>
    <circle cx="1200" cy="190" r="10"/><circle cx="1180" cy="660" r="10"/>
  </g>
