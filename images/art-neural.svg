<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="nn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081226"/>
      <stop offset="1" stop-color="#12203f"/>
    </linearGradient>
    <linearGradient id="nn-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="nn-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.4" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="nn-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#nn-bg)"/>
  <!-- layered network links -->
  <g stroke="url(#nn-link)" stroke-width="3">
    <path d="M280 240 L640 160"/><path d="M280 240 L640 380"/><path d="M280 450 L640 160"/><path d="M280 450 L640 380"/><path d="M280 450 L640 620"/>
    <path d="M280 660 L640 380"/><path d="M280 660 L640 620"/><path d="M280 240 L640 620"/>
    <path d="M640 160 L1000 280"/><path d="M640 160 L1000 520"/><path d="M640 380 L1000 280"/><path d="M640 380 L1000 520"/>
    <path d="M640 620 L1000 280"/><path d="M640 620 L1000 520"/><path d="M640 620 L1000 740"/><path d="M640 380 L1000 740"/>
    <path d="M1000 280 L1320 420"/><path d="M1000 520 L1320 420"/><path d="M1000 740 L1320 420"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="280" cy="240" r="34" fill="url(#nn-node)"/>
    <circle cx="280" cy="450" r="34" fill="url(#nn-node)"/>
    <circle cx="280" cy="660" r="34" fill="url(#nn-node)"/>
    <circle cx="640" cy="160" r="40" fill="url(#nn-node)"/>
    <circle cx="640" cy="380" r="40" fill="url(#nn-node)"/>
    <circle cx="640" cy="620" r="40" fill="url(#nn-node)"/>
    <circle cx="1000" cy="280" r="36" fill="url(#nn-node)"/>
    <circle cx="1000" cy="520" r="36" fill="url(#nn-node)"/>
    <circle cx="1000" cy="740" r="36" fill="url(#nn-node)"/>
    <circle cx="1320" cy="420" r="52" fill="url(#nn-node)"/>
  </g>
  <!-- pulse rings on output node -->
  <g fill="none" stroke="#7dd3fc" opacity="0.5">
    <circle cx="1320" cy="420" r="80" stroke-width="3"/>
    <circle cx="1320" cy="420" r="112" stroke-width="2" opacity="0.6"/>
    <circle cx="1320" cy="420" r="148" stroke-width="2" opacity="0.35"/>
  </g>
  <g fill="#7dd3fc" filter="url(#nn-glow)" opacity="0.65">
    <circle cx="640" cy="380" r="18"/><circle cx="1000" cy="520" r="16"/><circle cx="1320" cy="420" r="26"/>
  </g>
  <!-- ambient particles -->
  <g fill="#93c5fd" opacity="0.7">
    <circle cx="140" cy="120" r="4"/><circle cx="420" cy="80" r="3"/><circle cx="880" cy="110" r="4"/>
    <circle cx="1180" cy="90" r="3"/><circle cx="1500" cy="760" r="4"/><circle cx="520" cy="820" r="3"/>
    <circle cx="90" cy="520" r="3"/><circle cx="1480" cy="180" r="4"/>
  </g>
</svg>
